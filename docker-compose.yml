services:
  app:
    build: .
    container_name: analyze-files
    ports:
      - "8000:8000"
    # Скачанные файлы и SQLite переживают перезапуск контейнера.
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Переопределить настройки можно тут или через .env:
    # environment:
    #   PRECOMPUTE_ON_DOWNLOAD: "false"
